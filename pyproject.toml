[project]
name = "pg-analyst-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yash Goyal", email = "yashg4656@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.21.0",
    "structlog>=26.1.0",
]

[project.scripts]
pg-analyst-mcp = "pg_analyst_mcp:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "adversarial: adversarial/security-focused tests",
]
